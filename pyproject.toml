[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-remover"
version = "0.1.0"
description = "Attempts to isolate and remove translucent watermarks from a sample of images."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = ["wm_remover", "img_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]